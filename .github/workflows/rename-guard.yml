name: Rename guard

# Fails a PR that moves a template file without recording it in UPGRADES.yaml.

on:
  pull_request:
    paths:
      - "template/**"
      - "UPGRADES.yaml"
      - "fastapi_gen/upgrade/**"
      - "scripts/check_rename_coverage.py"
      - "scripts/record_renames.py"
      - ".github/workflows/rename-guard.yml"
  workflow_dispatch:

jobs:
  rename-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check rename coverage
        run: uv run python scripts/check_rename_coverage.py
