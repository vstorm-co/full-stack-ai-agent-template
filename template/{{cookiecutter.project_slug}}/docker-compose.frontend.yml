{%- if cookiecutter.enable_docker and cookiecutter.use_frontend %}
# Frontend development configuration
# Usage: docker-compose -f docker-compose.frontend.yml up -d
#
# Note: Backend must be running first (docker-compose up -d)
# Frontend connects to backend via host network

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the browser bundle at build time, so a
        # runtime `environment:` entry cannot change them — after editing these
        # you must rebuild: docker compose -f docker-compose.frontend.yml build
        # --no-cache frontend. They must point at an address the BROWSER can
        # reach; the defaults assume the browser runs on the Docker host. When
        # you open the app from another machine, set PUBLIC_HOST to this host's
        # address (e.g. PUBLIC_HOST=10.0.0.5) or override each URL directly.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://${PUBLIC_HOST:-localhost}:{{ cookiecutter.backend_port }}}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://${PUBLIC_HOST:-localhost}:{{ cookiecutter.backend_port }}}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://${PUBLIC_HOST:-localhost}:{{ cookiecutter.frontend_port }}}
        - NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB=50
{%- if cookiecutter.enable_oauth %}
        - NEXT_PUBLIC_OAUTH_PROVIDERS={% if cookiecutter.enable_oauth_google %}google{% endif %}
{%- endif %}
        - NEXT_PUBLIC_RAG_ENABLED={% if cookiecutter.enable_rag %}true{% else %}false{% endif %}
{%- if cookiecutter.enable_brand_from_config %}
        - NEXT_PUBLIC_BRAND_COLOR=${NEXT_PUBLIC_BRAND_COLOR:-{{ cookiecutter.brand_color }}}
        - NEXT_PUBLIC_BRAND_LOGO_URL=${NEXT_PUBLIC_BRAND_LOGO_URL:-}
{%- endif %}
    container_name: {{ cookiecutter.project_slug }}_frontend
    ports:
      - "{{ cookiecutter.frontend_port }}:{{ cookiecutter.frontend_port }}"
    environment:
      - NODE_ENV=development
      # Server-side only: resolved inside this container, never by the browser.
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:{{ cookiecutter.backend_port }}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # The oven/bun image has no curl/wget, so probe with bun's built-in fetch.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:{{ cookiecutter.frontend_port }}/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
{%- else %}
# Frontend is disabled for this project
{%- endif %}
